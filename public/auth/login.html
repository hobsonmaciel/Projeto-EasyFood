<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b6f47">
  <meta name="description" content="Entre no EasyFood e organize seus restaurantes favoritos.">
  <title>Login — EasyFood</title>
  <link rel="stylesheet" href="/assets/css/auth.css?v=20260920">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page login-page" data-page="login">
  <main class="auth-container">
    <div class="auth-wrapper">
      <!-- Coluna Esquerda - Branding -->
      <section class="auth-branding">
        <div class="brand-section">
          <h1 class="brand-title">EasyFood</h1>
          <p class="brand-tagline">Seu universo gastronômico, organizado.</p>
        </div>

        <div class="auth-illustration">
          <div class="illustration-item item-1">★</div>
          <div class="illustration-item item-2">◎</div>
          <div class="illustration-item item-3">✦</div>
        </div>

        <div class="brand-footer">
          <p>Gerencie seus restaurantes com elegância e simplicidade.</p>
        </div>
      </section>

      <!-- Coluna Direita - Formulário -->
      <section class="auth-form-section">
        <div class="form-wrapper">
          <div class="form-header">
            <h2>Bem-vindo de volta</h2>
            <p>Entre com suas credenciais para continuar</p>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>

          <form id="loginForm" class="auth-form">
            <div class="form-group">
              <label for="email">E-mail</label>
              <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="seu@email.com" 
                autocomplete="email"
                required
              >
            </div>

            <div class="form-group">
              <label for="password">Senha</label>
              <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="••••••••" 
                autocomplete="current-password"
                required
              >
            </div>

            <button type="submit" id="submitButton" class="btn-primary btn-large">
              Entrar
              <span class="btn-icon">→</span>
            </button>
          </form>

          <div class="form-divider">
            <span>ou</span>
          </div>

          <p class="form-switch">
            Não tem conta? 
            <a href="/auth/register" class="link-accent">Criar uma conta</a>
          </p>

          <p class="form-note">
            Seus dados estão protegidos por criptografia de ponta a ponta.
          </p>
        </div>
      </section>
    </div>
  </main>

  <script src="/assets/js/auth.js?v=20260920" defer></script>
</body>
</html>
